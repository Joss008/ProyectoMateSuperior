<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Proyecto Mate Superior</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hoja de Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <h2>RECUPERAR CONTRASEÑA</h2>
        <form id="formularioRecuperar">
            <p style="text-align: center; margin-bottom: 20px; font-size: 14px; color: #6b7280;">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="Ingresa tu correo" required>
            </div>
            
            <button type="submit">Enviar Enlace</button>
        </form>

        <div class="links">
            <a href="index.html">Volver a Inicio de Sesión</a>
        </div>
    </div>
    
    <script src="js/forgot-password.js"></script>  
</body>
</html>
