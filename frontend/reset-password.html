<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Proyecto Mate Superior</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Hoja de Estilos -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        <h2>RESTABLECER CONTRASEÑA</h2>
        <form id="formularioReset">
            <p style="text-align: center; margin-bottom: 20px; font-size: 14px; color: #cbd5e1;">Ingresa tu nueva contraseña para actualizar tu cuenta.</p>
            
            <div class="input-group">
                <label for="password">Nueva Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu nueva contraseña" required>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirmar Nueva Contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Repite tu nueva contraseña" required>
            </div>
            
            <button type="submit">Guardar Contraseña</button>
        </form>

        <div class="links">
            <a href="index.html">Volver a Inicio de Sesión</a>
        </div>
    </div>
    
    <script src="js/reset-password.js"></script>  
</body>
</html>
